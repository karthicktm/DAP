[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[build.buildArgs]
SUPABASE_URL = "${{SUPABASE_URL}}"
SUPABASE_ANON_KEY = "${{SUPABASE_ANON_KEY}}"
KIE_AI_API_KEY = "${{KIE_AI_API_KEY}}"

[deploy]
restartPolicyType = "on_failure"

[env]
PORT = "80"
FLUTTER_WEB_AUTO_DETECT = "true"
NODE_ENV = "production"